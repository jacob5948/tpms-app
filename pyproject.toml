[project]
name = "tpms"
version = "0.1.0"
description = "Capture, log and correlate TPMS sensor transmissions via rtl_433"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# playwright drives a real browser over the pages. UI work is checked in one
# rather than by reading the HTML: half of what these pages do -- charts,
# expanding rows, the bar that appears on the first tick -- only exists once
# script has run. After installing, fetch the browser once: `playwright
# install chromium`. Tests that need it skip themselves when it is absent.
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.44"]

[project.scripts]
tpms = "tpms.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tpms*"]

[tool.setuptools.package-data]
"tpms.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives a real browser; skipped when playwright or its browser is missing",
]
