# TPMS capture configuration. Copy to config.yaml and edit.

database: tpms.db

# Every time on screen -- tables, chart axes, CSV exports -- is written in
# this zone, and a date typed into a filter box is read in it. Readings are
# stored as epoch seconds, so changing this re-reads history rather than
# rewriting it. Any IANA name: America/Chicago, UTC, Europe/London.
timezone: America/Chicago

radio:
  # Path to the rtl_433 binary.
  binary: rtl_433

  # Frequencies to listen on, in Hz-ish rtl_433 notation.
  # One entry  -> tuned permanently to that band.
  # Two+ entries -> rtl_433 hops between them every `hop_seconds`.
  #
  # 315M   = North American factory TPMS (Toyota, Ford, GM, Honda, Nissan)
  # 433.92M = EU factory TPMS + most aftermarket / trailer sensors
  #
  # NOTE: hopping halves the duty cycle per band. Since sensors only transmit
  # every ~30-60s while rolling, hopping will miss a real fraction of passes.
  frequencies:
    - 315M
  hop_seconds: 30

  # Tuner options. Leave gain null for AGC.
  device: null        # e.g. "0" or a serial number
  gain: null          # e.g. 40.2
  ppm_error: null     # e.g. 12
  sample_rate: null   # e.g. 1024k

  # Restrict decoding to TPMS protocols only. Big CPU saving on a Pi and it
  # keeps weather stations / doorbells out of the log. Set true to decode all.
  all_protocols: false

  # Decoders to leave out, matched as a case-insensitive substring of the name
  # in `rtl_433 -R help`. Jansite is excluded by default because it also
  # matches other makers' bursts, so every passing car gets re-decoded a second
  # time under the Jansite name -- a phantom sensor that the duplicate detector
  # then has to identify and fold away. Set to [] to decode it again.
  exclude_protocols: ["Jansite"]

  # Extra raw arguments appended to the rtl_433 command line.
  extra_args: []

  # Archive every raw JSON line rtl_433 emits, so a normalization bug can
  # never lose data. Set to null to disable.
  raw_archive_dir: raw

  # Restart backoff bounds (seconds) if rtl_433 exits.
  restart_min_delay: 1
  restart_max_delay: 60

sessions:
  # A sensor stays in the same sighting while readings arrive at least this
  # often. Must comfortably exceed the sensor transmit interval (~30-60s).
  gap_seconds: 120

  # How often the background sweeper closes sightings that have gone quiet.
  sweep_interval_seconds: 15

aliases:
  # Several rtl_433 decoders will match the same RF burst with different
  # framing, so one transmitter appears two or three times under different
  # protocol names and IDs. They are identified by an identical signal level
  # at the identical instant -- two decoders parsing the same burst report
  # byte-identical RSSI and SNR; two real transmitters essentially never do.
  # Genuine duplicates agree exactly on all three -- both decoders are reading
  # the same burst. These margins are safety, not expected spread. Widening
  # them starts pulling in genuinely different sensors that happened to
  # transmit at a similar moment and level.
  time_tolerance: 1.0
  rssi_tolerance: 0.5
  snr_tolerance: 1.0

  # Only ever merge *different* decoders. Wheels on one car share an OEM
  # sensor type, so a same-decoder pair is two real sensors, never one twice.
  # One exception is always in force: ids differing in nothing but their
  # leading digit (Toyota/d157cd57 and Toyota/f157cd57) are one transmitter
  # the decoder read two ways, and are folded whatever this says.
  require_different_decoder: true

  min_shared_bursts: 1
  min_share_ratio: 0.5
  auto_interval_seconds: 300

clustering:
  # Two sensors "co-occur" when heard within this many seconds of each other.
  window_seconds: 10

  # A pair is only counted once per shared sighting, so a single long pass
  # cannot manufacture a strong edge.
  min_cooccurrences: 3

  # count / min(sightings_a, sightings_b). Rejects unrelated vehicles that
  # happened to pass together a few times.
  min_support: 0.6

  # Components that REACH this size are flagged for manual review rather than
  # auto-committed -- a component this big is almost always a bad merge. The
  # limit is inclusive: six sensors is already more than a car carries.
  max_cluster_size: 6

  # Wheel sets appear to be programmed with near-consecutive IDs, so two
  # sensors from one decoder with close IDs are probably one vehicle. This
  # never groups anything on its own: the pair must still have been heard
  # together. It also flags clusters spanning several unrelated ID blocks,
  # which usually means two cars that drove past at the same moment.
  # Measure it against your own capture first with `tpms ids`.
  id_adjacency: true

  # How close two IDs must be. The widest genuine pair seen in the field was
  # 10042 apart; unrelated sensors were millions apart.
  id_max_distance: 65536

  # That number was measured on 32-bit IDs. Decoders print different widths --
  # Renault six hex digits, Toyota eight -- and in a 24-bit space 65536 either
  # side of an ID covers a 256th of everything, so with fifty of them heard a
  # sensor is better than a one-in-three shot to find an unrelated "neighbour".
  #
  # So each decoder's distance is capped at the point where it would expect
  # this many unrelated ID-near neighbours per sensor, given how many of that
  # decoder have actually been heard. Wide sparse spaces keep the full 65536;
  # narrow crowded ones tighten to match. `tpms ids --sweep` prints the caps in
  # force and scores the capture with them off, so the default is checkable.
  # 0 turns it off and applies one distance to every decoder.
  id_coincidence_limit: 0.02

  # Group sensors heard together in a SINGLE pass when they look like one
  # vehicle: same decoder, comparable signal level. Most vehicles on a public
  # road are only ever heard once, so with this off they never group at all.
  # In a community, where most vehicles return, it is the visitors and the
  # deliveries. Either way it applies only to a pair that has never had the
  # chance to confirm: once the rarer of the two has been heard
  # min_cooccurrences times, its failure to coincide is evidence of absence.
  # Such vehicles are marked "provisional" until a return visit confirms them.
  # Turn off if you only care about vehicles you see repeatedly.
  single_pass: true
  single_pass_rssi_spread: 10.0

  # Re-run clustering automatically this often (seconds). 0 disables.
  auto_interval_seconds: 300

# Which wheels were heard says which side of the vehicle faced the receiver:
# the near side has clear air to the antenna, the far side has the car in the
# way. Turning a side into a direction needs something only you know -- which
# way traffic on that side is going -- so name the two sides here and the log
# will use the names. Leave them unset and it reports "left side" / "right
# side" instead, which is the honest half of the answer.
#
# Direction is read from the wheel labels you set on each sensor (FL, FR, RL,
# RR, or plain L / R when you know the side but not the end), so it says
# nothing until some wheels are labelled.
direction:
  left: null      # e.g. northbound
  right: null     # e.g. southbound
  # When both sides are audible the near one is the louder one -- but a single
  # reading's level swings a few dB on nothing at all, so one side must beat
  # the other by this much before the guess is worth making.
  rssi_margin: 6.0

web:
  host: 0.0.0.0
  port: 8080

retention:
  # Housekeeping. Measured on a year of typical traffic (6k readings/day) the
  # database reaches ~800 MB, roughly two thirds of which is the raw JSON text
  # of each reading -- and every one of those lines is also on disk under raw/.
  # So dropping the old ones costs nothing you cannot get back with
  # `tpms replay`, and it is the single biggest saving available.
  raw_days: 7

  # Deleting readings outright is the only setting here that really forgets
  # something, so it is off by default. Set it (90 is a sensible start) and the
  # database stops growing without bound. Sightings, sensors, vehicles and the
  # per-band totals are kept whatever this says: they are the summary of the
  # readings at a fraction of the size, so a database trimmed to a fortnight
  # still knows every vehicle it has ever heard.
  readings_days: null

  # raw/rtl433-YYYY-MM-DD.jsonl compresses about 10:1. Today's file is never
  # touched. null disables either step.
  archive_gzip_days: 7
  archive_delete_days: null

  # Reclaim the freed pages afterwards. SQLite never shrinks the file on its
  # own, but a VACUUM rewrites it, so it needs room for a second copy.
  vacuum: true

  # Do all of the above once a day inside the service. With this off, it only
  # happens when you run `tpms prune`.
  run_daily: true
